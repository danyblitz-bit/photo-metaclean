[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-metaclean"
version = "1.1.0"
description = "Remove hidden EXIF/GPS metadata from JPEG/PNG at the byte level — no re-encoding, no quality loss."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Danilo Fortunato" }]
keywords = [
    "exif",
    "gps",
    "metadata",
    "privacy",
    "jpeg",
    "png",
    "strip",
    "cli",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
]

[project.urls]
Homepage = "https://danyblitz-bit.github.io/photo-metaclean/"
Repository = "https://github.com/danyblitz-bit/photo-metaclean"
"Bug Tracker" = "https://github.com/danyblitz-bit/photo-metaclean/issues"

[project.scripts]
photometaclean = "photometaclean.__main__:main"

[tool.setuptools]
packages = ["photometaclean"]

[tool.setuptools.package-dir]
photometaclean = "."